version: '3.9'

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: securepulse-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.13.2
    container_name: securepulse-frigate
    privileged: true
    restart: unless-stopped
    shm_size: "256mb"
    devices:
      - /dev/bus/usb:/dev/bus/usb # For Coral TPU if connected
    ports:
      - "${FRIGATE_PORT:-5000}:5000"
      - "8554:8554" # RTSP feeds from go2rtc
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../frigate/config/frigate.yml:/config/frigate.yml
      - ../frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-secret}
      - RTSP_STREAM_URL=${RTSP_STREAM_URL:-rtsp://rtsp-sim:8554/live}
      - TZ=${TZ:-UTC}
    depends_on:
      - mqtt

  # Simulated RTSP Stream for local offline development & testing
  rtsp-sim:
    image: bluenviron/mediamtx:latest
    container_name: securepulse-rtsp-sim
    restart: unless-stopped
    ports:
      - "8554:8554"

volumes:
  mosquitto_data:
  mosquitto_log:
