name: securepulse

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
      POSTGRES_DB: ${POSTGRES_DB:-securepulse}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0.21
    restart: unless-stopped
    environment:
      MQTT_BACKEND_USER: securepulse
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in deployment/.env}
      MQTT_FRIGATE_PASSWORD: ${MQTT_FRIGATE_PASSWORD:?Set MQTT_FRIGATE_PASSWORD in deployment/.env}
    ports:
      - "127.0.0.1:${MQTT_PORT:-11883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - ./mosquitto/config/passwordfile:/mosquitto/config/passwordfile:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$${MQTT_BACKEND_USER}\" -P \"$${MQTT_BACKEND_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RTSP_PORT:-18554}:8554"
    volumes:
      - ../mediamtx/mediamtx.yml:/mediamtx.yml:ro

  sample-publisher:
    profiles: ["test-pattern"]
    image: jrottenberg/ffmpeg:7.1-ubuntu2404
    restart: unless-stopped
    depends_on:
      - mediamtx
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=10
      - -an
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/live

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.13.2
    restart: unless-stopped
    shm_size: "256mb"
    ports:
      - "${FRIGATE_BIND_ADDRESS:-127.0.0.1}:${FRIGATE_PORT:-15000}:5000"
      - "${FRIGATE_WEBRTC_BIND_ADDRESS:-127.0.0.1}:${FRIGATE_WEBRTC_PORT:-18556}:8555/tcp"
      - "${FRIGATE_WEBRTC_BIND_ADDRESS:-127.0.0.1}:${FRIGATE_WEBRTC_PORT:-18556}:8555/udp"
    volumes:
      - frigate_config:/config
      - ../frigate/config/frigate.yml:/config/config.yml:ro
      - ../frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
    environment:
      FRIGATE_RTSP_URL: ${FRIGATE_RTSP_URL:-rtsp://mediamtx:8554/live}
      FRIGATE_MQTT_USER: frigate
      FRIGATE_MQTT_PASSWORD: ${MQTT_FRIGATE_PASSWORD:?Set MQTT_FRIGATE_PASSWORD in deployment/.env}
      FRIGATE_WEBRTC_CANDIDATE: ${FRIGATE_WEBRTC_CANDIDATE:-127.0.0.1:8556}
      TZ: ${TZ:-UTC}
    depends_on:
      mqtt:
        condition: service_healthy

  backend:
    build:
      context: ..
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-securepulse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}@postgres:5432/${POSTGRES_DB:-securepulse}
      FRIGATE_URL: http://frigate:5000
      GO2RTC_URL: http://frigate:1984
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: securepulse
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Set MQTT_BACKEND_PASSWORD in deployment/.env}
      MQTT_EVENT_QUEUE_SIZE: ${MQTT_EVENT_QUEUE_SIZE:-256}
      FRIGATE_MQTT_TOPIC: frigate/events
      SECURITY_ENGINE_FAILURE_MODE: ${SECURITY_ENGINE_FAILURE_MODE:-STORE_UNCLASSIFIED}
      SECURITY_ENGINE_TIMEOUT_SECONDS: ${SECURITY_ENGINE_TIMEOUT_SECONDS:-1}
      SECURITY_ENGINE_SUPPORTS_TRACKING: ${SECURITY_ENGINE_SUPPORTS_TRACKING:-false}
      USE_LOCAL_SECURITY_ENGINE: ${USE_LOCAL_SECURITY_ENGINE:-false}
      TRACKING_LOST_TRACK_TIMEOUT_SECONDS: ${TRACKING_LOST_TRACK_TIMEOUT_SECONDS:-3}
      TRACKING_MINIMUM_DETECTION_CONFIDENCE: ${TRACKING_MINIMUM_DETECTION_CONFIDENCE:-0.5}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frigate_config:
  mosquitto_data:
  mosquitto_log:
