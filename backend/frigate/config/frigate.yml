mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  topic_prefix: frigate
  client_id: frigate

go2rtc:
  webrtc:
    candidates:
      - "127.0.0.1:18556"
  streams:
    front_door: "{FRIGATE_RTSP_URL}"
    laptop_camera: "rtsp://mediamtx:8554/webcam"

detectors:
  cpu1:
    type: cpu
    num_threads: 3

database:
  path: /config/frigate.db

detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5

objects:
  track:
    - person
  filters:
    person:
      min_area: 5000
      max_area: 100000
      min_score: 0.5
      threshold: 0.7

cameras:
  front_door:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: false
      retain:
        days: 7
        mode: motion
      events:
        retain:
          default: 14
          mode: active_objects
    snapshots:
      enabled: true
      clean_copy: true
      timestamp: true
      bounding_box: true
      crop: false
      retain:
        default: 14

  laptop_camera:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/laptop_camera
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: false
    snapshots:
      enabled: true
      clean_copy: true
      timestamp: true
      bounding_box: true
      crop: false
      retain:
        default: 14
