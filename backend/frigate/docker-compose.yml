services:
  frigate:
    # Legacy standalone path retained for existing installs. The canonical
    # stack is ../deployment/docker-compose.yml; this is opt-in to avoid two
    # Frigate instances and published-port conflicts.
    profiles: ["legacy-standalone"]
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    shm_size: "256mb"

    ports:
      - "127.0.0.1:18971:8971"
      - "127.0.0.1:28554:8554"
      - "127.0.0.1:28556:8555/tcp"
      - "127.0.0.1:28556:8555/udp"

    volumes:
      - ./config:/config
      - ./storage:/media/frigate
