# Alembic configuration for EDI-SecurePulse
#
# The real DATABASE_URL is loaded from .env at runtime by env.py.
# Do NOT put credentials in this file.

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Placeholder — overridden by env.py at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Truncate long revision identifiers in filenames
truncate_slug_length = 40

# Timezone for revision timestamps
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
