services:
  postgres:
    image: postgres:16-alpine
    container_name: securepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepulse}
      POSTGRES_DB: ${POSTGRES_DB:-securepulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: securepulse-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.13.2
    container_name: securepulse-frigate
    restart: unless-stopped
    shm_size: "256mb"
    ports:
      - "${FRIGATE_PORT:-5000}:5000"
      - "${FRIGATE_WEBRTC_PORT:-8556}:8555/tcp" # WebRTC
      - "${FRIGATE_WEBRTC_PORT:-8556}:8555/udp" # WebRTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../frigate/config/frigate.yml:/config/frigate.yml
      - ../frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD:-secret}
      - RTSP_STREAM_URL=${RTSP_STREAM_URL:-rtsp://rtsp-sim:8554/live}
      - FRIGATE_WEBRTC_CANDIDATE=${FRIGATE_WEBRTC_CANDIDATE:-127.0.0.1:8556}
      - TZ=${TZ:-UTC}
    depends_on:
      - mqtt

  backend:
    build:
      context: ../backend
    container_name: securepulse-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-securepulse}:${POSTGRES_PASSWORD:-securepulse}@postgres:5432/${POSTGRES_DB:-securepulse}
      FRIGATE_URL: http://frigate:5000
      GO2RTC_URL: http://frigate:1984
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      FRIGATE_MQTT_TOPIC: frigate/events
      SECURITY_ENGINE_FAILURE_MODE: ${SECURITY_ENGINE_FAILURE_MODE:-STORE_UNCLASSIFIED}
      # The optional external engine is not part of this compose stack. Fail
      # quickly to the documented unclassified fallback when it is absent.
      SECURITY_ENGINE_TIMEOUT_SECONDS: ${SECURITY_ENGINE_TIMEOUT_SECONDS:-1}
      SECURITY_ENGINE_SUPPORTS_TRACKING: ${SECURITY_ENGINE_SUPPORTS_TRACKING:-false}
      USE_LOCAL_SECURITY_ENGINE: ${USE_LOCAL_SECURITY_ENGINE:-false}
      TRACKING_LOST_TRACK_TIMEOUT_SECONDS: ${TRACKING_LOST_TRACK_TIMEOUT_SECONDS:-3}
      TRACKING_MINIMUM_DETECTION_CONFIDENCE: ${TRACKING_MINIMUM_DETECTION_CONFIDENCE:-0.5}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Simulated RTSP Stream for local offline development & testing
  rtsp-sim:
    image: bluenviron/mediamtx:latest
    container_name: securepulse-rtsp-sim
    restart: unless-stopped
    ports:
      - "8554:8554"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
