name: Edge configuration and dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: backend/dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r ../requirements-test.txt
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          DASHBOARD_TEST_PYTHON: python
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/reporter-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: mobile/reporter-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r ../../backend/requirements-test.txt
      - run: npm run typecheck
      - run: npm test
        env:
          DASHBOARD_TEST_PYTHON: python
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios --output-dir dist
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-validation-only
      MQTT_BACKEND_PASSWORD: ci-validation-only
      MQTT_FRIGATE_PASSWORD: ci-validation-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose --env-file /dev/null -f backend/deployment/docker-compose.yml config --quiet
      - run: docker compose --env-file /dev/null --profile test-pattern -f backend/deployment/docker-compose.yml config --quiet
      - run: docker compose --profile legacy-standalone -f backend/frigate/docker-compose.yml config --quiet
      - name: Parse host PowerShell entrypoints
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem backend/scripts/*.ps1) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed: $($file.Name): $parseErrors" }
          }
